spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      # The initial Cloud SQL instance is deliberately small; avoid exhausting its connections
      # when Cloud Run starts more than one request-handling thread.
      maximum-pool-size: ${DATABASE_MAXIMUM_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 10s
      max-lifetime: 25m
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    clean-disabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true

server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: WARN

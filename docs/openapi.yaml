openapi: 3.1.0
info:
  title: Taxi Ride Matching API
  version: 1.0.0-MVP
  description: |
    JWT-protected API for registering travelers, planning rides, finding compatible
    routes, accepting matches, and messaging in private accepted-match chats.
    Register or log in, then supply `Authorization: Bearer <accessToken>`.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Authentication
  - name: Users
  - name: Rides
  - name: Matches
  - name: Chats
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a traveler and send an email verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '202': {description: Verification code sent, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationPendingResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Email is already registered}
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and issue a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Logged in, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '401': {description: Invalid email or password}
        '403': {description: Email address has not yet been verified}
  /api/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify the six-digit email code and issue a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerificationCodeRequest'}
      responses:
        '200': {description: Gmail verified, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {description: Invalid, expired, or exhausted verification code}
  /api/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Send a replacement email verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResendVerificationRequest'}
      responses:
        '202': {description: Replacement code sent, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationPendingResponse'}}}}
        '400': {description: No pending verification or resend cooldown is active}
  /api/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated traveler
      responses:
        '200': {description: Traveler profile, content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
  /api/rides:
    get:
      tags: [Rides]
      summary: List my ride requests
      responses:
        '200': {description: Ride list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RideResponse'}}}}}
    post:
      tags: [Rides]
      summary: Create a ride request for the authenticated traveler
      description: Resolves both locations, calculates a route, stores an OPEN ride, and evaluates potential matches.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRideRequest'}
      responses:
        '201': {description: Ride created, content: {application/json: {schema: {$ref: '#/components/schemas/RideResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '502': {description: Maps provider request failed}
        '503': {description: Maps provider is unavailable or quota-limited}
  /api/rides/{rideId}:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      tags: [Rides]
      summary: Get one of my rides
      responses:
        '200': {description: Ride found, content: {application/json: {schema: {$ref: '#/components/schemas/RideResponse'}}}}
        '403': {description: Ride belongs to another traveler}
        '404': {description: Ride not found}
    put:
      tags: [Rides]
      summary: Update one of my OPEN rides
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRideRequest'}
      responses:
        '200': {description: Ride updated, content: {application/json: {schema: {$ref: '#/components/schemas/RideResponse'}}}}
        '403': {description: Ride belongs to another traveler}
        '409': {description: Ride is no longer OPEN}
    delete:
      tags: [Rides]
      summary: Soft-cancel one of my rides
      responses:
        '200': {description: Ride cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/RideResponse'}}}}
        '403': {description: Ride belongs to another traveler}
        '409': {description: Ride cannot be cancelled in its current state}
  /api/rides/{rideId}/matches:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      tags: [Matches]
      summary: List potential matches for one of my rides
      responses:
        '200': {description: Ranked matches, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RideMatchResponse'}}}}}
        '403': {description: Ride belongs to another traveler}
  /api/matches/{matchId}/accept:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Matches]
      summary: Accept a match as the authenticated participant
      responses:
        '200': {description: Decision recorded; chatId is present after both users accept, content: {application/json: {schema: {$ref: '#/components/schemas/MatchActionResponse'}}}}
        '403': {description: User is not a match participant}
        '409': {description: Match cannot be accepted in its current state}
  /api/matches/mine:
    get:
      tags: [Matches]
      summary: List the authenticated user's ranked ride matches
      responses:
        '200': {description: Ranked matches, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RideMatchResponse'}}}}}
  /api/matches/{matchId}/reject:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Matches]
      summary: Reject a match as the authenticated participant
      responses:
        '200': {description: Match rejected, content: {application/json: {schema: {$ref: '#/components/schemas/MatchActionResponse'}}}}
        '403': {description: User is not a match participant}
  /api/chats/mine:
    get:
      tags: [Chats]
      summary: List the authenticated user's chats
      responses:
        '200': {description: Chat list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ChatResponse'}}}}}
  /api/chats/{chatId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chats]
      summary: Get a chat if I am a participant
      responses:
        '200': {description: Chat found, content: {application/json: {schema: {$ref: '#/components/schemas/ChatResponse'}}}}
        '403': {description: User is not a chat participant}
  /api/chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chats]
      summary: List messages if I am a participant
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Message page, content: {application/json: {schema: {$ref: '#/components/schemas/MessagePage'}}}}
        '403': {description: User is not a chat participant}
    post:
      tags: [Chats]
      summary: Send a message as the authenticated participant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageRequest'}
      responses:
        '201': {description: Message created, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
        '403': {description: User is not a chat participant}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    RideId: {name: rideId, in: path, required: true, schema: {type: string, format: uuid}}
    MatchId: {name: matchId, in: path, required: true, schema: {type: string, format: uuid}}
    ChatId: {name: chatId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    BadRequest: {description: Request validation failed}
  schemas:
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName: {type: string, example: Nithin}
        lastName: {type: string, example: User}
        email: {type: string, format: email, example: nithin@gmail.com, description: Gmail address only}
        phoneNumber: {type: string, example: '+1 312-555-0101'}
        password: {type: string, format: password, minLength: 8, writeOnly: true}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, description: Gmail address only}
        password: {type: string, format: password, writeOnly: true}
    VerificationCodeRequest:
      type: object
      required: [email, code]
      properties:
        email: {type: string, format: email, example: nithin@gmail.com}
        code: {type: string, pattern: '^[0-9]{6}$', example: '123456'}
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, example: nithin@gmail.com}
    VerificationPendingResponse:
      type: object
      properties:
        email: {type: string, format: email}
        expiresAt: {type: string, format: date-time}
        verificationRequired: {type: boolean, example: true}
    AuthResponse:
      type: object
      properties:
        accessToken: {type: string, description: JWT bearer token}
        tokenType: {type: string, example: Bearer}
        expiresAt: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/UserResponse'}
    UserResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        phoneNumber: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateRideRequest:
      type: object
      required: [pickupAddress, destinationAddress, departureTime]
      properties:
        pickupAddress: {type: string, example: 'Schaumburg, IL'}
        destinationAddress: {type: string, example: 'Millennium Park, Chicago, IL'}
        departureTime: {type: string, format: date-time}
    RideResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid, readOnly: true}
        pickupAddress: {type: string}
        pickupLatitude: {type: number}
        pickupLongitude: {type: number}
        destinationAddress: {type: string}
        destinationLatitude: {type: number}
        destinationLongitude: {type: number}
        routeDistanceMeters: {type: integer, format: int64}
        routeDurationSeconds: {type: integer, format: int64}
        departureTime: {type: string, format: date-time}
        status: {type: string, enum: [OPEN, MATCHED, CANCELLED, COMPLETED]}
    RideMatchResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        rideRequest1Id: {type: string, format: uuid}
        rideRequest2Id: {type: string, format: uuid}
        matchScore: {type: number}
        pickupDistanceMeters: {type: number}
        destinationDistanceMeters: {type: number}
        routeSimilarity: {type: number}
        status: {type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]}
    MatchActionResponse:
      type: object
      properties:
        matchId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]}
        chatId: {type: [string, 'null'], format: uuid}
    ChatResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        rideMatchId: {type: string, format: uuid}
        participantIds: {type: array, items: {type: string, format: uuid}}
        createdAt: {type: string, format: date-time}
    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 4000}
    MessageResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        chatId: {type: string, format: uuid}
        senderId: {type: string, format: uuid}
        message: {type: string}
        sentAt: {type: string, format: date-time}
    MessagePage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/MessageResponse'}}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
        number: {type: integer}
security:
  - bearerAuth: []
